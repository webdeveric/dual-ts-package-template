name: Node.js CI

on: [push]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: 0

jobs:
  core-checks:
    name: Core checks
    permissions:
      contents: read # for checkout
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          install: false # Audit before installing dependencies

      - name: Audit dependencies
        run: pnpm audit --audit-level=moderate --prod

      - name: Installing dependencies
        run: pnpm install --frozen-lockfile

      - name: Type checking
        run: pnpm typecheck

      - name: Linting
        run: pnpm lint

      - name: Spell check
        run: pnpm spellcheck

  ci:
    name: Continuous Integration
    needs: core-checks
    permissions:
      contents: read # for checkout
    strategy:
      fail-fast: true
      matrix:
        node: [22, 24, 26]
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          require-lockfile: true
          runtime: node@${{ matrix.node }}

      - name: Verify registry signatures for installed packages
        run: pnpm audit signatures

      - name: Building
        run: pnpm build

      - name: Testing
        run: pnpm coverage
